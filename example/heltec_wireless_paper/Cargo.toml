[package]
name = "example"
version = "0.0.1"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
log = "*"

# esp32 support
esp-hal = { version = "*", features = ["unstable", "esp32s3"] }
esp-bootloader-esp-idf = { version = "*", features = ["esp32s3"] }
esp-alloc = { version = "*", features = ["esp32s3"] }
esp-println = { version = "*", features = ["log-04", "esp32s3"] }

# embedded-hal support
embedded-hal = "*"
embedded-hal-bus = "*"
embedded-hal-async = "*"

# display support
epd-rs = { path = "../..", features = ["log"]}
display-interface = "*"
display-interface-spi = "*"
embedded-graphics = "*"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
